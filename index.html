<!DOCTYPE html> 
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destiny Tales</title>
  <meta name="robots" content="noindex, follow">
  <script>
    (function () {

      let savedLang;
      try { savedLang = localStorage.getItem('dt_lang'); } catch (_) {}

      // если язык уже выбран — используем его
      if (['ru', 'en', 'vn'].includes(savedLang)) {
        location.replace('/' + savedLang + '/');
        return;
      }

      const lang = (navigator.language || '').toLowerCase();

      // RU и похожие
      const ruLangs = ['ru','uk','be','kk','uz','ky','tg','tk','hy','az','ka','mo'];

      for (let i = 0; i < ruLangs.length; i++) {
        if (lang.startsWith(ruLangs[i])) {
          location.replace('/ru/');
          return;
        }
      }

      // всё остальное → EN
      location.replace('/en/');

    })();
  </script>
</head>
<body><nav aria-label="Language"><a href="/ru/">Русский</a> · <a href="/en/">English</a> · <a href="/vn/">Tiếng Việt</a></nav></body>
</html>
